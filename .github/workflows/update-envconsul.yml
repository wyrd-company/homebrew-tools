# relationships:
#   references: update-envconsul
name: Update envconsul

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-envconsul
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          ssh-key: ${{ secrets.FORMULAE_PUBLISH_KEY }}

      - name: Update formula from verified release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-envconsul.py

      - name: Check formula style
        run: brew style Formula/envconsul.rb

      - name: Commit and push formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/envconsul.rb
          if git diff --cached --quiet -- Formula/envconsul.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/envconsul.rb)
          git commit -m "envconsul ${version}"
          git push origin HEAD:main
